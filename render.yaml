services:
  - type: web
    name: voice-patient-registration
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////data/patients.db
      - key: SEED_ON_STARTUP
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: VAPI_MODEL
        value: gpt-4o-mini
      - key: VAPI_VOICE_PROVIDER
        value: vapi
      - key: VAPI_VOICE_ID
        value: Elliot
      - key: VAPI_WEBHOOK_SECRET
        generateValue: true
