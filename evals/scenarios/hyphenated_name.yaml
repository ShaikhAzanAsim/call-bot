id: hyphenated_name
description: Apostrophes and hyphens survive normalization.
caller_number: "2065550119"
ground_truth:
  first_name: O'Brien
  last_name: Smith-Jones
  date_of_birth: "10/10/1979"
  sex: Other
  phone_number: "2065550119"
  address_line_1: 12 Harbor Way
  city: Seattle
  state: WA
  zip_code: "98101"
checks: [saved, matches_ground_truth]
steps:
  - tool: record_field
    args: {field: first_name, spoken_value: "o'brien"}
    expect: {ok: true, normalized_value: O'Brien}
  - tool: record_field
    args: {field: last_name, spoken_value: "smith-jones"}
    expect: {ok: true, normalized_value: Smith-Jones}
  - tool: record_field
    args: {field: date_of_birth, spoken_value: "10/10/1979"}
    expect: {ok: true}
  - tool: record_field
    args: {field: sex, spoken_value: "non-binary"}
    expect: {ok: true, normalized_value: Other}
  - tool: record_field
    args: {field: phone_number, spoken_value: "2065550119"}
    expect: {ok: true}
  - tool: record_field
    args: {field: address_line_1, spoken_value: "12 Harbor Way"}
    expect: {ok: true}
  - tool: record_field
    args: {field: city, spoken_value: Seattle}
    expect: {ok: true}
  - tool: record_field
    args: {field: state, spoken_value: WA}
    expect: {ok: true}
  - tool: record_field
    args: {field: zip_code, spoken_value: "98101"}
    expect: {ok: true}
  - tool: get_draft
    args: {}
    expect: {ready_to_confirm: true}
  - tool: confirm_registration
    args: {}
    expect: {ok: true}
  - tool: save_patient
    args: {}
    expect: {ok: true}
