id: proxy_mother
description: The caller is registering their mother. The relationship stays off the patient row.
caller_number: "3125550108"
ground_truth:
  first_name: Elena
  last_name: Cruz
  date_of_birth: "02/02/1958"
  sex: Female
  phone_number: "3125550108"
  address_line_1: 200 Lake Street
  city: Chicago
  state: IL
  zip_code: "60601"
checks: [saved, matches_ground_truth, proxy_not_on_patient]
steps:
  - tool: set_proxy_registration
    args: {relationship: mother}
    expect: {ok: true}
  - tool: record_field
    args: {field: first_name, spoken_value: Elena}
    expect: {ok: true}
  - tool: record_field
    args: {field: last_name, spoken_value: Cruz}
    expect: {ok: true}
  - tool: record_field
    args: {field: date_of_birth, spoken_value: "February 2, 1958"}
    expect: {ok: true}
  - tool: record_field
    args: {field: sex, spoken_value: female}
    expect: {ok: true}
  - tool: record_field
    args: {field: phone_number, spoken_value: "3125550108"}
    expect: {ok: true}
  - tool: record_field
    args: {field: address_line_1, spoken_value: "200 Lake Street"}
    expect: {ok: true}
  - tool: record_field
    args: {field: city, spoken_value: Chicago}
    expect: {ok: true}
  - tool: record_field
    args: {field: state, spoken_value: Illinois}
    expect: {ok: true, normalized_value: IL}
  - tool: record_field
    args: {field: zip_code, spoken_value: "60601"}
    expect: {ok: true}
  - tool: get_draft
    args: {}
    expect: {ready_to_confirm: true}
  - tool: confirm_registration
    args: {}
    expect: {ok: true}
  - tool: save_patient
    args: {}
    expect: {ok: true}
