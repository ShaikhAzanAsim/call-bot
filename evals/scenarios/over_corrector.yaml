id: over_corrector
description: The caller corrects the last name three times. Only the last spelling is saved.
caller_number: "2125550103"
ground_truth:
  first_name: Ava
  last_name: Davis
  date_of_birth: "07/04/1988"
  sex: Female
  phone_number: "2125550103"
  address_line_1: 20 Broadway
  city: New York
  state: NY
  zip_code: "10001"
checks: [saved, matches_ground_truth, corrections_applied]
steps:
  - tool: record_field
    args: {field: first_name, spoken_value: Ava}
    expect: {ok: true}
  - tool: record_field
    args: {field: last_name, spoken_value: Davies}
    expect: {ok: true, normalized_value: Davies}
  - tool: record_field
    args: {field: last_name, spoken_value: "D as in David, A, V, I, E, S"}
    expect: {ok: true, normalized_value: Davies}
  - tool: record_field
    args: {field: last_name, spoken_value: "D as in David, A, V, I, S"}
    expect: {ok: true, normalized_value: Davis}
  - tool: record_field
    args: {field: date_of_birth, spoken_value: "July 4, 1988"}
    expect: {ok: true}
  - tool: record_field
    args: {field: sex, spoken_value: female}
    expect: {ok: true}
  - tool: record_field
    args: {field: phone_number, spoken_value: "2125550103"}
    expect: {ok: true}
  - tool: record_field
    args: {field: address_line_1, spoken_value: "20 Broadway"}
    expect: {ok: true}
  - tool: record_field
    args: {field: city, spoken_value: "New York"}
    expect: {ok: true}
  - tool: record_field
    args: {field: state, spoken_value: "New York"}
    expect: {ok: true, normalized_value: NY}
  - tool: record_field
    args: {field: zip_code, spoken_value: "10001"}
    expect: {ok: true}
  - tool: get_draft
    args: {}
    expect: {ready_to_confirm: true}
  - tool: confirm_registration
    args: {}
    expect: {ok: true}
  - tool: save_patient
    args: {}
    expect: {ok: true}
