id: future_dob
description: A future date of birth is rejected and the same field is asked again.
caller_number: "2065550104"
ground_truth:
  first_name: Ana
  last_name: Cruz
  date_of_birth: "04/12/1988"
  sex: Female
  phone_number: "2065550104"
  address_line_1: 10 Main Street
  city: Seattle
  state: WA
  zip_code: "98101"
checks: [saved, matches_ground_truth, reprompted_date_of_birth]
steps:
  - tool: record_field
    args: {field: first_name, spoken_value: Ana}
    expect: {ok: true}
  - tool: record_field
    args: {field: last_name, spoken_value: Cruz}
    expect: {ok: true}
  - tool: record_field
    args: {field: date_of_birth, spoken_value: "April 12, 2030"}
    expect: {ok: false, repair_step: 1}
  - tool: record_field
    args: {field: date_of_birth, spoken_value: "April 12, 1988"}
    expect: {ok: true, normalized_value: "04/12/1988"}
  - tool: record_field
    args: {field: sex, spoken_value: female}
    expect: {ok: true}
  - tool: record_field
    args: {field: phone_number, spoken_value: "2065550104"}
    expect: {ok: true}
  - tool: record_field
    args: {field: address_line_1, spoken_value: "10 Main Street"}
    expect: {ok: true}
  - tool: record_field
    args: {field: city, spoken_value: Seattle}
    expect: {ok: true}
  - tool: record_field
    args: {field: state, spoken_value: WA}
    expect: {ok: true}
  - tool: record_field
    args: {field: zip_code, spoken_value: "98101"}
    expect: {ok: true}
  - tool: get_draft
    args: {}
    expect: {ready_to_confirm: true}
  - tool: confirm_registration
    args: {}
    expect: {ok: true}
  - tool: save_patient
    args: {}
    expect: {ok: true}
