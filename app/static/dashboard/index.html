<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intake desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --wall: #e4eef3;
      --chart: #f7fbfc;
      --ink: #102830;
      --mist: #5c7380;
      --rule: #c5d6df;
      --held: #0c7560;
      --held-wash: #e5f5f0;
      --correction: #b42318;
      --correction-wash: #fdeceb;
      --lamp: #d4922a;
      --lamp-dim: #c5d0d6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 0% -10%, #f8fbfc 0%, transparent 60%),
        var(--wall);
      font: 16px/1.45 Figtree, "Segoe UI", sans-serif;
    }
    a { color: var(--ink); }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }
    header, main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      padding: 28px 0 18px;
    }
    .eyebrow {
      margin: 0 0 6px;
      font: 600 12px/1 "Schibsted Grotesk", Figtree, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mist);
    }
    h1 {
      margin: 0;
      font: 700 40px/0.95 "Schibsted Grotesk", Figtree, sans-serif;
      letter-spacing: -0.045em;
    }
    .lede { margin: 8px 0 0; max-width: 42ch; color: var(--mist); }
    .line {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px 8px 8px;
      background: var(--chart);
      border: 1px solid var(--rule);
      border-radius: 999px;
    }
    .lamp {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--lamp-dim);
      box-shadow: inset 0 0 0 3px #edf3f6;
    }
    .lamp.lit {
      background: var(--lamp);
      box-shadow: 0 0 0 4px rgba(212, 146, 42, 0.22);
      animation: glow 1.6s ease-in-out infinite;
    }
    .line strong { font: 650 14px/1 "Schibsted Grotesk", Figtree, sans-serif; }
    .api {
      display: inline-block;
      margin-top: 8px;
      font-size: 13px;
      color: var(--mist);
    }
    main { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 16px; padding-bottom: 40px; }
    .card {
      background: var(--chart);
      border: 1px solid var(--rule);
      border-radius: 18px;
      padding: 18px 18px 8px;
      box-shadow: 0 1px 0 rgba(16, 40, 48, 0.04);
    }
    .card h2 {
      margin: 0;
      font: 650 18px/1 "Schibsted Grotesk", Figtree, sans-serif;
      letter-spacing: -0.03em;
    }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
    .meta { margin: 0 0 12px; color: var(--mist); font-size: 14px; }
    .pill {
      border-radius: 999px;
      padding: 4px 9px;
      background: #e7eef2;
      color: var(--mist);
      font: 600 12px/1 Figtree, sans-serif;
      text-transform: lowercase;
    }
    .pill.in_progress { background: #f8edd8; color: #8a5a10; }
    .pill.completed { background: var(--held-wash); color: var(--held); }
    .pill.failed, .pill.abandoned { background: var(--correction-wash); color: var(--correction); }
    .field {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 11px 0;
      border-top: 1px solid var(--rule);
    }
    .field span:first-child { text-transform: capitalize; }
    .ok { color: var(--held); font-weight: 650; }
    .bad { color: var(--correction); font-weight: 650; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      padding: 8px 6px;
      text-align: left;
      color: var(--mist);
      font: 600 11px/1 Figtree, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--rule);
    }
    td { padding: 12px 6px; border-bottom: 1px solid var(--rule); vertical-align: top; }
    .name { font-weight: 650; }
    .tape { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 12px; }
    .tick {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px dashed var(--rule);
      font: 12px/1.4 "IBM Plex Mono", Consolas, monospace;
    }
    .tick b { font-weight: 500; color: var(--ink); }
    .tick span, .empty { color: var(--mist); }
    @keyframes glow {
      50% { box-shadow: 0 0 0 7px rgba(212, 146, 42, 0.08); }
    }
    @media (max-width: 800px) {
      h1 { font-size: 32px; }
      header { flex-direction: column; align-items: flex-start; }
      main { grid-template-columns: 1fr; }
      thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tr { padding: 12px 0; border-bottom: 1px solid var(--rule); }
      td { border: 0; padding: 2px 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lamp.lit { animation: none; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Voice registration</p>
      <h1>Intake desk</h1>
      <p class="lede">Watch a registration fill in while the caller is still on the phone. Every name here is fictional.</p>
    </div>
    <div>
      <div class="line" id="line">
        <span class="lamp" id="lamp" aria-hidden="true"></span>
        <strong id="line-label">Line is quiet</strong>
      </div>
      <a class="api" href="/docs">Open the API docs</a>
    </div>
  </header>
  <main>
    <section class="card">
      <div class="head">
        <h2>This call</h2>
        <span id="call-status" class="pill">idle</span>
      </div>
      <p id="call-meta" class="meta">Waiting for the phone to ring.</p>
      <div id="fields"></div>
      <div class="head" style="margin-top: 22px">
        <h2>Flight recorder</h2>
      </div>
      <div id="timeline" class="tape"><p class="empty">No events yet.</p></div>
    </section>
    <section class="card">
      <div class="head">
        <h2>Chart</h2>
      </div>
      <table>
        <thead>
          <tr><th>Name</th><th>Date of birth</th><th>Phone</th><th>City</th></tr>
        </thead>
        <tbody id="patients"></tbody>
      </table>
    </section>
  </main>
  <script>
    const fieldsEl = document.querySelector("#fields");
    const patientsEl = document.querySelector("#patients");
    const timelineEl = document.querySelector("#timeline");
    const statusEl = document.querySelector("#call-status");
    const metaEl = document.querySelector("#call-meta");
    const lampEl = document.querySelector("#lamp");
    const lineLabel = document.querySelector("#line-label");
    const focus = new URLSearchParams(location.hash.slice(1)).get("call") || (location.hash.match(/call=([^&]+)/) || [])[1];
    let activeId = focus || null;
    const lineCopy = {
      idle: "Line is quiet",
      in_progress: "On the line",
      completed: "Record saved",
      failed: "Save did not finish",
      abandoned: "Caller hung up"
    };

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[ch]));
    }

    function phone(value) {
      const digits = String(value || "").replace(/\D/g, "");
      if (digits.length === 10) return `(${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6)}`;
      return value || "";
    }

    function renderDraft(draft, events) {
      const collected = (draft && draft.fields) || {};
      const failed = {};
      (events || []).forEach((event) => {
        if (event.type === "validation_failed" && event.payload) failed[event.payload.field] = event.payload;
      });
      const names = Object.keys({...collected, ...failed});
      fieldsEl.innerHTML = names.map((name) => {
        const label = esc(name.replaceAll("_", " "));
        if (failed[name] && collected[name] == null) {
          return `<div class="field"><span>${label}</span><span class="bad">Rejected, step ${esc(failed[name].repair_step)}</span></div>`;
        }
        const shown = name.includes("phone") ? phone(collected[name]) : collected[name];
        return `<div class="field"><span>${label}</span><span class="ok">${esc(shown || "")}</span></div>`;
      }).join("") || `<p class="empty">No fields yet. They appear as the caller answers.</p>`;
    }

    async function loadPatients() {
      const response = await fetch("/patients");
      const body = await response.json();
      patientsEl.innerHTML = (body.data || []).map((row) =>
        `<tr><td class="name">${esc(row.first_name)} ${esc(row.last_name)}</td><td>${esc(row.date_of_birth)}</td><td>${esc(phone(row.phone_number))}</td><td>${esc(row.city)}, ${esc(row.state)}</td></tr>`
      ).join("") || `<tr><td colspan="4" class="empty">No patients on the chart.</td></tr>`;
    }

    async function loadCall(callId) {
      const response = await fetch(`/calls/${callId}`);
      if (!response.ok) return;
      const body = await response.json();
      const call = body.data;
      activeId = call.call_id;
      statusEl.textContent = call.status;
      statusEl.className = `pill ${call.status || ""}`;
      lampEl.classList.toggle("lit", call.status === "in_progress");
      lineLabel.textContent = lineCopy[call.status] || call.status;
      metaEl.textContent = `${call.call_id} · ${phone(call.caller_number) || "unknown caller"}${call.summary ? " · " + call.summary : ""}`;
      renderDraft(call.draft, call.events);
      const events = call.events || [];
      timelineEl.innerHTML = events.map((event) => {
        const clock = esc(String(event.ts || "").slice(11, 19));
        return `<div class="tick"><span>${clock}</span><div><b>${esc(event.type)}</b><br><span>${esc(JSON.stringify(event.payload))}</span></div></div>`;
      }).join("") || `<p class="empty">No events yet.</p>`;
    }

    async function pickCall() {
      if (activeId) return loadCall(activeId);
      const response = await fetch("/calls/active");
      const body = await response.json();
      if (body.data && body.data[0]) return loadCall(body.data[0].call_id);
    }

    const source = new EventSource("/events");
    source.onmessage = (message) => {
      const event = JSON.parse(message.data);
      if (!activeId) activeId = event.call_id;
      if (event.call_id === activeId) loadCall(activeId);
      if (event.type === "save_success") loadPatients();
    };
    loadPatients();
    pickCall();
    setInterval(pickCall, 4000);
  </script>
</body>
</html>
